# Default Active Profile
spring.profiles.active=dev

# Database Configuration (Reads from environment variables, defaults to local H2)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ambula;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never


jwt.secret=${JWT_SECRET:ambula-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000

cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
server.port=${PORT:8080}

# Groq API Configuration for AI Features
groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY_HERE}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant


