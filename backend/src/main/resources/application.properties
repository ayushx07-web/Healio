# H2 In-Memory Database (Default for zero-setup local development)
spring.datasource.url=jdbc:h2:mem:ambula;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# PostgreSQL Configuration (Uncomment to use local PostgreSQL server)
# spring.datasource.url=jdbc:postgresql://localhost:5432/ambula
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.sql.init.mode=always

jwt.secret=ambula-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

spring.web.cors.allowed-origins=http://localhost:5173
server.port=8080

# Groq API Configuration for AI Features
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant

